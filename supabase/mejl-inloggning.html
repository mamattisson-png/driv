<!-- Mejlet med inloggningskoden. Klistras in i Supabase: Authentication → Email Templates → Magic Link (Message body).
     Ämne: Din inloggningskod till Driv. Loggan är en bild eftersom mejlprogram inte laddar appens typsnitt. -->
<!doctype html>
<html lang="sv">
<body style="margin:0;padding:0;background:#0d0e10;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d0e10;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#16181b;border:1px solid #2a2d32;border-radius:24px;">
      <tr><td style="padding:28px 28px 8px;">
        <img src="https://driv.driveify.se/icons/mejl-logga-v1.png" width="174" height="55" alt="Driv – Ditt mål. Ditt driv." style="display:block;border:0;">
      </td></tr>
      <tr><td style="padding:20px 28px 0;font-family:Helvetica,Arial,sans-serif;color:#f4f2ef;">
        <div style="font-size:22px;font-weight:bold;margin:0 0 6px;">Logga in på Driv</div>
        <div style="font-size:15px;color:#9ea3aa;">Din kod:</div>
        <div style="font-size:40px;font-weight:bold;letter-spacing:6px;margin:6px 0 18px;color:#f4f2ef;">{{ .Token }}</div>
        <div style="font-size:15px;color:#f4f2ef;margin:0 0 16px;">Skriv koden i appen, eller tryck på knappen:</div>
      </td></tr>
      <tr><td style="padding:0 28px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ff6b1a;color:#0d0e10;font-family:Helvetica,Arial,sans-serif;font-size:16px;font-weight:bold;text-decoration:none;padding:14px 28px;border-radius:16px;">Logga in</a>
      </td></tr>
      <tr><td style="padding:22px 28px 28px;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#9ea3aa;line-height:1.5;">
        Koden gäller en kort stund och kan bara användas en gång. Har du inte bett om den kan du strunta i mejlet.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>

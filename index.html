<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0e10">
<meta name="description" content="Driv – träning, mat och vanor, enkelt och på ett ställe.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-v2.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Driv">
<title>Driv</title>
<script>
  // Utseende väljs i Inställningar och gäller den här enheten; sätts före första ritningen så att inget blinkar
  // Mörkt är standard; "auto" följer telefonen
  try { const t = localStorage.getItem("driv-theme") || "dark"; if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = "dark"; }
  // Testläge (adressen slutar på ?test): egen data i webbläsaren som aldrig kopplas till kontot.
  // Bara för utvecklaren: första gången öppnas det med en personlig kod (?test=kod), sedan minns enheten det.
  // Här finns bara kodens fingeravtryck. Andra som skriver ?test får den vanliga appen.
  // Eget manifest så att en ikon på hemskärmen öppnar testläget.
  (() => {
    const q = new URLSearchParams(location.search), code = q.get("test");
    const fnv = s => { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(s)) h = Math.imul((h ^ b) >>> 0, 0x01000193) >>> 0; return h.toString(16).padStart(8, "0"); };
    let dev = false;
    try { dev = localStorage.getItem("driv-dev") === "1"; } catch (e) {}
    if (code && fnv(code) === "1686b317") { dev = true; try { localStorage.setItem("driv-dev", "1"); } catch (e) {} }
    window.DRIV_TEST = dev && q.has("test");
  })();
  if (window.DRIV_TEST) {
    document.querySelector('link[rel="manifest"]').href = "manifest-test.webmanifest";
    document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "Driv test";
    document.title = "Driv test";
  }
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Färger. Mörkt läge först: nästan svart botten, kort i lite ljusare grått och en orange accent.
     Text och knappar har egna toner så att kontrasten når 4,5:1 (WCAG AA); --accent används för staplar, prickar och ramar. */
  :root {
    --bg: #f5f4f1; --card: #ffffff; --card-2: #efede9; --text: #141518; --muted: #5d6168;
    --line: #e3e0da; --line-strong: #c9c5be; --mhead: #efede9; --accent: #ff6b1a; --accent-soft: #fde6d6;
    --ok: #1f9d55; --ok-soft: #dcf3e5; --bad: #d23b3b; --bad-soft: #fbe3e3;
    --push: #c94800; --pull: #2f6fdb; --legs: #8a4fd6; --upper: #c2410c; --lower: #0e7c86; --full: #4d7c0f;
    --equip: #9aa1ab;
    /* Fyllda ytor har samma klara orange som mörkt läge, med mörk text (6,4:1). Mörk orange bara för text och länkar. */
    --accent-strong: #ff6b1a; --accent-text: #b03f00; --ok-text: #157a40; --bad-text: #b42323; --on-color: #141518; --ok-strong: #157a40;
    --on-accent: #141518;
    --shadow-card: 0 1px 2px rgba(20, 21, 24, .04); --shadow-nav: 0 6px 20px rgba(20, 21, 24, .08);
    --nav-bg: #ffffff; --tile-line: #e3e0da;
    /* Vännernas profilbilder: pastell med mörk bokstav i ljust läge, mörkare med ljus bokstav i mörkt */
    --av-sat: 70%; --av-bg-l: 90%; --av-fg-l: 24%;
    /* Muskelkartan: grön med, gul-orange delvis (inte knapporange), röd saknas */
    --m-ok: #1f9d55; --m-part: #f59e0b; --m-miss: #e5484d; --m-off: #e6e3de; --m-head: #d6d2cb; --m-part-text: #8a4b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0e10; --card: #16181b; --card-2: #1f2226; --text: #f4f2ef; --muted: #9ea3aa;
      --line: #2a2d32; --line-strong: #3a3e44; --mhead: #1f2226; --accent: #ff6b1a; --accent-soft: #3a2312;
      --ok: #6fd99a; --ok-soft: #173325; --bad: #ff9a9a; --bad-soft: #3a1d1d;
      --push: #ff6b1a; --pull: #5e95ff; --legs: #b17cff; --upper: #f59e0b; --lower: #2dd4bf; --full: #84cc16;
      --equip: #6b7178;
      --accent-strong: #ff6b1a; --accent-text: #ff8a47; --ok-text: #6fd99a; --bad-text: #ff9a9a; --on-color: #0d0e10; --ok-strong: #6fd99a;
      --on-accent: #0d0e10;
      --shadow-card: none; --shadow-nav: 0 10px 30px rgba(0, 0, 0, .25); --nav-bg: #1f2226; --tile-line: transparent;
      --av-sat: 38%; --av-bg-l: 30%; --av-fg-l: 88%;
      --m-ok: #1f9d55; --m-part: #f59e0b; --m-miss: #e5484d; --m-off: #2a2d32; --m-head: #3a3e44; --m-part-text: #fbbf24;
      color-scheme: dark;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    --bg: #0d0e10; --card: #16181b; --card-2: #1f2226; --text: #f4f2ef; --muted: #9ea3aa;
    --line: #2a2d32; --line-strong: #3a3e44; --mhead: #1f2226; --accent: #ff6b1a; --accent-soft: #3a2312;
    --ok: #6fd99a; --ok-soft: #173325; --bad: #ff9a9a; --bad-soft: #3a1d1d;
    --push: #ff6b1a; --pull: #5e95ff; --legs: #b17cff; --upper: #f59e0b; --lower: #2dd4bf; --full: #84cc16;
    --equip: #6b7178;
    --accent-strong: #ff6b1a; --accent-text: #ff8a47; --ok-text: #6fd99a; --bad-text: #ff9a9a; --on-color: #0d0e10; --ok-strong: #6fd99a;
    --on-accent: #0d0e10;
    --shadow-card: none; --shadow-nav: 0 10px 30px rgba(0, 0, 0, .25); --nav-bg: #1f2226; --tile-line: transparent;
    --av-sat: 38%; --av-bg-l: 30%; --av-fg-l: 88%;
    --m-ok: #1f9d55; --m-part: #f59e0b; --m-miss: #e5484d; --m-off: #2a2d32; --m-head: #3a3e44; --m-part-text: #fbbf24;
    color-scheme: dark;
  }
  /* Lexend för text, Unbounded för rubriker och stora tal. Ligger i appen så att den fungerar offline. */
  @font-face { font-family: "Lexend"; font-weight: 300; font-display: block; src: url(fonts/lexend-300.woff2) format("woff2"); }
  @font-face { font-family: "Lexend"; font-weight: 400; font-display: swap; src: url(fonts/lexend-400.woff2) format("woff2"); }
  @font-face { font-family: "Lexend"; font-weight: 500; font-display: swap; src: url(fonts/lexend-500.woff2) format("woff2"); }
  @font-face { font-family: "Lexend"; font-weight: 600 900; font-display: swap; src: url(fonts/lexend-600.woff2) format("woff2"); }
  @font-face { font-family: "Unbounded"; font-weight: 300; font-display: block; src: url(fonts/unbounded-300.woff2) format("woff2"); }
  @font-face { font-family: "Unbounded"; font-weight: 400 900; font-display: swap; src: url(fonts/unbounded-600.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  /* Menyn flyter 20 px över botten och är 68 px hög; innehållet slutar ovanför den */
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 400 16px/1.45 "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(116px + env(safe-area-inset-bottom)); }
  main { max-width: 640px; margin: 0 auto; padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font: 600 24px/1.2 "Unbounded", sans-serif; margin: 6px 0 18px; min-height: 32px; }
  h1 .muted { font-weight: 500; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  h3 { font-weight: 600; }
  b, strong { font-weight: 600; }
  .ic { display: block; flex: none; }
  button[aria-label] > .ic:only-child, button.iconbtn > .ic { margin: 0 auto; }
  ol { padding-left: 20px; margin: 10px 0 0; }
  li { margin-bottom: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
  .card.warn { background: var(--accent-soft); border-color: transparent; font-size: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .col { display: flex; flex-direction: column; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 14px; padding: 8px 14px; min-height: 44px; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-color); font-weight: 600; }
  button.small { padding: 4px 12px; font-size: 14px; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent-text); text-decoration: underline; min-height: 0; display: inline; }
  button.wide { width: 100%; margin-bottom: 10px; padding: 12px; }
  button.primary.wide, .bigbtn { min-height: 56px; border-radius: 18px; font-size: 17px; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 12px; min-height: 44px; width: 100%; min-width: 0; }
  input::placeholder { color: var(--muted); opacity: .55; }
  /* Webbläsarens pilar i sifferfält tar plats och behövs inte; på mobilen syns de inte ändå */
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; width: 100%; resize: vertical; }
  input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--ok); }
  label.field { display: block; font-size: 14px; color: var(--muted); }
  label.field input, label.field select { margin-top: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }
  .bar.ok > div { background: var(--ok); }
  .bar.over > div { background: var(--bad); }
  /* Passets etikett: en accent för alla pass */
  .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 99px; color: var(--on-accent); background: var(--accent-strong); line-height: 1.2; }
  .pill { font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--ok-soft); color: var(--ok-text); font-weight: 600; }
  .delta { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
  .delta.up { background: var(--ok-soft); color: var(--ok-text); }
  .delta.down { background: var(--bad-soft); color: var(--bad-text); }
  .delta.same { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
  .stat { font-size: 26px; font-weight: 700; }

  /* Upplägg */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .brand { display: flex; gap: 14px; align-items: center; margin: 4px 0 18px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; }
  .brand .ordbild { margin: 0; display: inline-flex; flex-direction: column; gap: 6px; line-height: 1; }
  /* DRIV och slogan lika långa: bokstavsluften är uppmätt för de här typsnitten */
  .brand .wordmark { font: 300 26px "Unbounded", sans-serif; letter-spacing: .4466em; margin-right: -.4466em; }
  .brand .slogan { font: 300 13px "Lexend", sans-serif; white-space: nowrap; }
  .brand .slogan em { font-style: normal; color: var(--accent-text); }
  .seg.count { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .seg.count button { padding: 8px 0; }
  .seg.two { grid-template-columns: 1fr 1fr; }
  .seg.two button { text-align: left; padding: 10px 12px; }
  .seg.wd { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .seg.wd button { padding: 9px 0; font-size: 14px; }
  .seg button.on { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-color); }
  .seg button.on .muted { color: var(--on-color); }

  /* Pass */
  .daypick { display: grid; gap: 6px; margin-bottom: 18px; padding: 5px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .daypick button { min-height: 52px; padding: 4px 2px; border: 0; border-radius: 14px; background: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; }
  .daypick button b { font-size: 14px; font-weight: 500; color: var(--text); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .daypick button.on { background: var(--text); color: var(--bg); }
  .daypick button.on b { color: var(--bg); font-weight: 600; }
  .card.ex.complete { border-color: var(--ok); }
  .sets { display: grid; grid-template-columns: 24px 1fr 1fr 40px; gap: 6px; align-items: center; margin-top: 10px; }
  .sets.bw { grid-template-columns: 24px 1fr 84px 40px; }
  .sets .n { color: var(--muted); font-size: 14px; text-align: center; }
  .done-btn { width: 40px; height: 38px; padding: 0; font-weight: 700; color: var(--muted); }
  .done-btn.big { width: 44px; height: 44px; border-radius: 99px; flex: none; display: grid; place-items: center;
    background: none; border: 1.5px solid var(--line-strong); color: var(--muted); }
  .dailies .done-btn:not(.on) .ic { visibility: hidden; }
  .done-btn.on { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
  .subex { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .daily { padding: 10px 0; border-top: 1px solid var(--line); }
  .daily:first-of-type { border-top: 0; padding-top: 0; }
  .daily .subex { margin-left: 8px; }
  .runin { width: 140px; gap: 6px; }

  /* Figurer */
  .thumb { padding: 0; border-radius: 10px; background: var(--bg); width: 84px; height: 84px; flex: none; overflow: hidden; }
  .thumb.sm { width: 52px; height: 52px; border-radius: 8px; }
  .thumb.xs { width: 40px; height: 40px; border-radius: 7px; }
  .thumb.done { outline: 2px solid var(--ok); outline-offset: -2px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .fig { width: 100%; height: 100%; display: block; }
  .fig.big { width: 100%; height: auto; max-height: 300px; background: var(--bg); border-radius: 12px; margin: 6px 0 8px; }
  .fb { fill: none; stroke: var(--text); stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
  .ff { opacity: .38; }
  .fh { fill: var(--text); }
  .fe { fill: none; stroke: var(--equip); stroke-width: 3; stroke-linecap: round; }
  .completed-sets { border-bottom: 1px solid var(--line); }
  .completed-sets summary { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 2px; color: var(--muted); font-size: 14px; cursor: pointer; list-style: none; }
  .completed-sets summary::-webkit-details-marker { display: none; }
  .completed-sets summary > .ic:first-child { color: var(--ok-text); }
  .completed-sets[open] summary > .ic:last-child { transform: rotate(90deg); }
  .completed-sets > .fsets { margin: 4px 0 12px; }
  .completed-sets .fset.done:not(.active) { min-height: 44px; padding-top: 0; padding-bottom: 0; }
  .completed-sets .fsel { min-height: 44px; }
  .fbar { stroke-width: 3.5; }
  .fplate { stroke-width: 4; }
  .fw { fill: var(--accent); }
  .fwbar { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
  .fwplate { stroke-width: 4; }
  .fp { fill: var(--equip); }
  .fc { stroke: var(--equip); stroke-width: 1.2; }
  .ffloor { stroke: var(--line); stroke-width: 2; }

  /* Dialog */
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  /* Med en ruta öppen står sidan bakom still; bara rutan rullar */
  html:has(.overlay), html:has(.overlay) body { overflow: hidden; }
  .overlay, .sheet { overscroll-behavior: contain; }
  .sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  /* Välj övning: sök, kroppsdel, utrustning och en lista med rubriker */
  .picksheet { padding-top: 12px; }
  .psearch { position: relative; margin: 6px 0 10px; }
  .psearch .ic { position: absolute; left: 14px; top: 13px; color: var(--muted); }
  .psearch input { padding-left: 42px; height: 46px; border-radius: 14px; background: var(--card-2); border-color: transparent; }
  .pfilters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 8px; }
  .pfilter { position: relative; display: flex; align-items: center; min-width: 0; }
  .pfilter select { appearance: none; -webkit-appearance: none; height: 40px; width: 100%; min-width: 0; text-overflow: ellipsis; padding: 0 34px 0 14px; border-radius: 99px;
    background: var(--card-2); border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 14px; }
  .pfilter .ic { position: absolute; right: 12px; pointer-events: none; color: var(--muted); }
  .pfilter.on select { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  .pfilter.on .ic { color: var(--bg); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .picklist { margin-top: 6px; }
  .pgroup2 h3 { margin: 14px 2px 4px; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .pgroup2 h3 + .pick { border-top: 0; }
  .thumb.pt { width: 56px; height: 56px; border-radius: 14px; background: var(--card-2); border: 0; }
  .pick .grow { min-width: 0; }
  .pick .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pickadd { width: 44px; height: 44px; flex: none; padding: 0; border-radius: 22px; display: grid; place-items: center;
    background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
  .pickhave { width: 44px; height: 44px; flex: none; display: grid; place-items: center; color: var(--ok-text); }
  .pick.have .pname { color: var(--muted); }
  .pname { font-weight: 500; font-size: 15px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font-size: 14px; padding: 5px 10px; border-radius: 99px; }
  .chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .food { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .food:first-of-type { border-top: 0; }
  nav { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    bottom: calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 616px; margin: 0 auto; height: 68px; padding: 6px;
    background: var(--nav-bg); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-nav);
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); z-index: 5; }
  nav.hidden { display: none; }
  /* Botten bakom menyn: inget innehåll syns under eller bredvid den när man scrollar */
  body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: calc(104px + env(safe-area-inset-bottom, 0px)); z-index: 4;
    pointer-events: none; background: linear-gradient(to bottom, transparent, var(--bg) 16px); }
  body:has(nav.hidden)::after { display: none; }
  /* Medan man skriver på en telefon behövs inte menyn; den skulle annars ligga ovanpå tangentbordet */
  @media (pointer: coarse) { body.typing nav, body.typing::after { display: none; }
    /* Knappar som annars ligger fast i nederkanten följer sidan, så att de inte täcker fältet */
    body.typing .pagefoot, body.typing .kadd { position: static; } }
  nav button { border: 0; border-radius: 18px; background: transparent; padding: 0; min-height: 0; font-size: 12px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  nav button.on { background: var(--text); color: var(--bg); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: middle; }

    border: 1.5px solid transparent; grid-template-columns: none; grid-template-areas: none; }

  .fdone { margin: 4px 0 0; min-height: 56px; border-radius: 16px; font-size: 17px; font-weight: 700; }

  .fall { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--ok-text); font-weight: 600; font-size: 14px; }

  .chipbtn { min-height: 38px; padding: 0 12px; border-radius: 99px; font-size: 13px; color: var(--muted); background: var(--card); display: inline-flex; align-items: center; gap: 4px; }

  @keyframes konfetti { from { opacity: 0; translate: 0 18px; } to { opacity: 1; translate: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .confetti rect, .confetti circle { animation: none; } }
  .pdcheck { position: relative; width: 84px; height: 84px; border-radius: 42px; background: var(--ok); color: var(--on-color); }
  .pdstats { gap: 10px; }

  /* Första besöket */
  body.onboard { padding-bottom: env(safe-area-inset-bottom); }
  body.onboard main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .welcome { position: relative; flex: 1; display: flex; flex-direction: column; }
  .welcome-glow { position: fixed; left: 0; right: 0; top: -260px; height: 560px; pointer-events: none;
    background: radial-gradient(ellipse 75% 50% at 50% 50%, color-mix(in srgb, var(--accent) 30%, transparent), transparent); }
  .welcome-brand { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 64px; }
  .welcome-brand img { width: 104px; height: 104px; border-radius: 28px; box-shadow: 0 16px 40px color-mix(in srgb, var(--accent) 30%, transparent); }
  .welcome-brand .ordbild { margin: 26px 0 0; display: inline-flex; flex-direction: column; gap: 12px; line-height: 1; min-height: 0; }
  .welcome-brand .wordmark { font: 300 40px "Unbounded", sans-serif; letter-spacing: .4466em; margin-right: -.4466em; }
  .welcome-brand .slogan { font: 300 20px "Lexend", sans-serif; }
  .welcome-brand .slogan em { font-style: normal; color: var(--accent-text); }
  .wpoints { position: relative; display: flex; flex-direction: column; gap: 8px; margin: 44px 0 24px; }
  .wpoint { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
  .wpoint b { display: block; font-weight: 600; }
  .wic { width: 40px; height: 40px; border-radius: 20px; flex: none; background: var(--card-2); color: var(--accent-text); display: grid; place-items: center; }
  .welcome-cta, .login-cta, .stepcta { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 0 8px; text-align: center; }
  .welcome-cta .wide, .login-cta .wide, .stepcta .wide { margin: 0; }
  .stepcta { position: sticky; bottom: 0; background: linear-gradient(to bottom, transparent, var(--bg) 18px); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .steptop { margin-bottom: 4px; }
  .stepbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 2px 0 22px; }
  .stepbar i { height: 4px; border-radius: 99px; background: var(--line); }
  .stepbar i.on { background: var(--accent); }
  .lead { font-size: 15px; margin: -10px 0 16px; }
  .progtiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .progtile { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 6px; min-height: 66px; padding: 10px 12px;
    border-radius: 18px; background: var(--card); border: 1.5px solid var(--line); color: var(--text); text-align: left; min-width: 0; }
  .progtile b { font: 700 12.5px/1.2 "Unbounded", sans-serif; }
  .progtile > span { font-size: 12px; color: var(--muted); }
  .progtile.on { border-color: var(--accent); background: var(--accent-soft); }
  .progtile.own { flex-direction: row; align-items: center; width: 100%; margin-top: 8px; border-style: dashed; gap: 12px; }
  .progtile.own b { font: 600 15px "Lexend", sans-serif; }
  .progtile.own.on { border-style: solid; }
  .seg.count { gap: 5px; }
  .seg.count button { min-height: 50px; border-radius: 14px; font: 700 16px "Unbounded", sans-serif; color: var(--muted); }
  .seg button.on, .seg.count button.on { background: var(--accent-soft); border: 1.5px solid var(--accent); color: var(--text); }
  .seg button.on .muted, .seg button.on span { color: var(--muted); }
  .seg.two button { display: flex; flex-direction: column; gap: 2px; border-radius: 18px; padding: 12px 14px; }
  .seg.two button span { font-size: 13px; color: var(--muted); }
  .seg.wd { gap: 5px; margin-bottom: 10px; }
  .seg.wd button { min-height: 42px; border-radius: 12px; border: 0; background: var(--card-2); color: var(--muted); font-weight: 600; }
  .seg.wd button.on { background: var(--accent-strong); color: var(--on-accent); border: 0; }
  .wdcard { padding: 14px; }
  .daysnote { margin: 8px 4px 0; }
  .seg.three.goalstep { margin-bottom: 14px; }
  .seg.three.goalstep button { display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 18px; padding: 10px 6px; }
  .seg.three.goalstep span { font-size: 12px; color: var(--muted); }
  .goalfields .grid2 { gap: 8px; }
  .goalfields label.field { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px 4px; font-size: 13px; }
  .goalfields label.field input, .goalfields label.field select { border: 0; background: none; padding: 0; min-height: 32px; margin: 0; font-weight: 600; font-size: 16px; color: var(--text); }
  .goalfields label.field[style] { margin-top: 8px !important; }
  .goalres { display: flex; flex-direction: column; gap: 4px; margin: 16px 0 0; padding: 16px; border: 1.5px solid var(--accent); background: var(--card); border-radius: 22px; }
  .goalnum { font: 800 28px/1.1 "Unbounded", sans-serif; }
  .goalnum small { font-size: 14px; font-weight: 500; }
  .note-card { font-size: 14px; }
  .login { flex: 1; display: flex; flex-direction: column; }
  .loginlogo { width: 56px; height: 56px; border-radius: 16px; margin: 18px 0 22px; }
  .loginic { width: 56px; height: 56px; border-radius: 16px; margin: 18px 0 22px; background: var(--card-2); color: var(--accent-text); display: grid; place-items: center; }
  .login h1 { margin-bottom: 18px; }
  .login .field input { margin-top: 6px; min-height: 54px; border-radius: 16px; border: 1.5px solid var(--accent); background: var(--card); font-size: 17px; }
  .codefield { min-height: 64px; margin: 6px 0 12px; border-radius: 18px; border: 1.5px solid var(--accent); background: var(--card); text-align: center;
    font: 700 26px "Unbounded", sans-serif; letter-spacing: .3em; }

  /* Upplägg */
  .progcard { border: 1.5px solid var(--accent); display: flex; flex-direction: column; gap: 4px; padding: 16px; }

  .passchips { margin-top: 10px; gap: 6px; }

  .progpick { margin: -4px 0 14px; }
  .utiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .utile { display: flex; flex-direction: column; justify-content: space-between; gap: 8px; min-height: 164px; margin: 0; text-align: left; color: var(--text); padding: 16px; }

  /* Inställningar */
  .ptitle { margin: 4px 0 16px; }

  /* Tangentbordet: rutor ovanför det (Android krymper sidan; iOS mäts med visualViewport, --kb) */
  .overlay { padding-bottom: var(--kb, 0px); }
  .sheet { max-height: calc(100dvh - var(--kb, 0px) - 24px); }
  /* Lägg till mat: måltiden som rubrik, ett fält, två små val och förslagen som en lista */
  .foodsheet { padding-top: 14px; }
  .fshead h2 { font: 800 22px/1.2 "Unbounded", sans-serif; margin: 2px 0 0; }
  .foodsheet .mealseg { display: flex; gap: 6px; margin: 12px 0 12px; overflow-x: auto; scrollbar-width: none; }
  .foodsheet .mealseg button { flex: none; min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1.5px solid transparent; background: var(--card-2); color: var(--muted); font-size: 14px; }
  .foodsheet .mealseg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; }
  .finput { position: relative; display: flex; align-items: center; }
  .finput > .ic { position: absolute; left: 14px; color: var(--muted); pointer-events: none; }

  .finput input:focus { border-color: var(--accent); outline: 0; }

  .fopts { display: flex; gap: 18px; margin: 6px 4px 2px; }

  .fsub { margin: 14px 2px 2px; }
  .fvars { display: flex; align-items: center; gap: 6px; margin: -2px -20px 10px 0; padding-right: 20px; overflow-x: auto; scrollbar-width: none; }

  .fvars > * { flex: none; }
  .addpage .fvars { margin-right: -16px; padding-right: 16px; }
  .fvars button { min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-strong); background: none; color: var(--text); font-size: 13px; }
  .foodsheet .qgrid { display: flex; flex-direction: column; gap: 0; }

    border-radius: 0; background: none; text-align: left; font-size: 15px; }
  .foodsheet .qadd:first-child { border-top: 0; }
  .foodsheet .qadd .col { gap: 1px; min-width: 0; }

  .foodsheet .qplus { width: 34px; height: 34px; flex: none; border-radius: 17px; background: var(--card-2); color: var(--accent-text); display: grid; place-items: center; font-size: 15px; }
  .qmore { margin-top: 2px; }

  /* Kost: veckan, kvar idag, måltiderna som rader */
  .kdate { font-size: 14px; margin: -14px 2px 12px; }

  .kwd { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 0; padding: 8px 0; border: 0; border-radius: 14px; background: var(--card); color: var(--muted); font-size: 11px; }
  .kwd .ktr { position: relative; display: block; width: 8px; height: 34px; border-radius: 99px; background: var(--line); overflow: hidden; }

  .kwd .ktr i.over { background: var(--bad); }

  .ksum { padding: 16px 18px; }
  .ksumtop { align-items: flex-end; margin-bottom: 10px; }
  .kleft { font: 800 32px/1.05 "Unbounded", sans-serif; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kleft small { font: 500 14px "Lexend", sans-serif; color: var(--muted); }
  .kate { text-align: right; }
  .kbar { height: 8px; margin: 0; }
  .kprot { margin-top: 14px; }

  .kdaycard { padding: 0 16px; }

  .kmrow .col { min-width: 0; gap: 1px; }
  .kmrow b { font-weight: 600; }

  .kmrow.empty .kmic { color: var(--muted); }

  .kmopen { display: flex; flex: 1; min-width: 0; align-items: center; gap: 12px; min-height: 64px; padding: 8px 0; border: 0; border-radius: 0;
    background: none; color: var(--text); text-align: left; font: inherit; }
  .kmopen .col { min-width: 0; gap: 1px; }
  .kmadd { width: 40px; height: 40px; flex: none; padding: 0; border-radius: 20px; border: 0; background: var(--card-2); color: var(--accent-text);
    display: grid; place-items: center; }

  /* Kost, översikten: luftigare – datumrad, en ring i mitten, lugna rutor och ett kort per måltid */
  .kdnav { display: flex; align-items: center; justify-content: space-between; margin: 0 -8px 2px; }
  .kdnav .iconbtn { width: 40px; height: 40px; min-height: 40px; color: var(--muted); }
  .kdtitle { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--text); font: 700 14px "Lexend", sans-serif;

  .kringbox > .link { margin: 10px 4px 0; display: inline-block; }
  .ksec { font: 700 12px "Lexend", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 12px 4px 6px; }
  .kmeals { display: flex; flex-direction: column; gap: 8px; }
  .kmcard { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border: 0; border-radius: 16px; padding: 2px 8px 2px 14px;

  /* Måltidens sida och receptet i samma stil som översikten */

<script>
  // Tangentbordets höjd där sidan inte krymper av sig själv (iOS): rutor lägger sig ovanför
  if (window.visualViewport) {
    const vv = window.visualViewport, kb = () => document.documentElement.style.setProperty("--kb", `${Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop))}px`);
    vv.addEventListener("resize", kb); vv.addEventListener("scroll", kb); kb();
  }
  // Skrivfält i fokus: menyn göms (se body.typing)
  const typing = el => el && el.matches && el.matches("textarea, input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=button])");
  document.addEventListener("focusin", e => document.body.classList.toggle("typing", typing(e.target)));
  document.addEventListener("focusout", () => setTimeout(() => document.body.classList.toggle("typing", typing(document.activeElement)), 0));
  // Offline och installation på hemskärmen när appen ligger på en vanlig webbplats
  if (!window.claude && "serviceWorker" in navigator && (location.protocol === "https:" || window.__swTest)) {
    // Appen startar från cachen. Finns en ny version installeras den i bakgrunden och
    // tas i bruk nästa gång appen kommer tillbaka i förgrunden.
    const hadWorker = !!navigator.serviceWorker.controller;
    let updated = false;
    navigator.serviceWorker.register("sw.js").then(reg => {
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") return;
        if (updated) location.reload();
        else reg.update().catch(() => {});
      });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadWorker) updated = true; });
  }
</script>

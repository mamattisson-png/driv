<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="Driv – träning, mat och vanor, enkelt och på ett ställe.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Driv">
<title>Driv</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #15181d; --muted: #5c6470;
    --line: #e2e5ea; --accent: #ef5b00; --accent-soft: #ffe7d6;
    --ok: #1f9d55; --ok-soft: #dcf3e5; --bad: #d23b3b; --bad-soft: #fbe3e3;
    --push: #c94800; --pull: #2f6fdb; --legs: #8a4fd6; --upper: #c2410c; --lower: #0e7c86; --full: #4d7c0f;
    --equip: #9aa1ab;
    /* Text och knappar har egna, mörkare toner så att kontrasten når 4,5:1 (WCAG AA).
       --accent och --ok används för staplar, prickar och ramar. */
    --accent-strong: #c94800; --accent-text: #b93d00; --ok-text: #157a40; --bad-text: #b42323; --on-color: #ffffff; --ok-strong: #157a40;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1215; --card: #181c21; --text: #eef1f4; --muted: #929ba6;
      --line: #2a3038; --accent: #ff7a1a; --accent-soft: #3a2312;
      --ok: #3ccf7a; --ok-soft: #173325; --bad: #ff6b6b; --bad-soft: #3a1d1d;
      --push: #ff7a1a; --pull: #5e95ff; --legs: #b17cff; --upper: #f59e0b; --lower: #2dd4bf; --full: #84cc16;
      --equip: #5d6670;
      --accent-strong: #ff7a1a; --accent-text: #ff7a1a; --ok-text: #3ccf7a; --bad-text: #ff6b6b; --on-color: #111418; --ok-strong: #3ccf7a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1215; --card: #181c21; --text: #eef1f4; --muted: #929ba6;
    --line: #2a3038; --accent: #ff7a1a; --accent-soft: #3a2312;
    --ok: #3ccf7a; --ok-soft: #173325; --bad: #ff6b6b; --bad-soft: #3a1d1d;
    --push: #ff7a1a; --pull: #5e95ff; --legs: #b17cff; --upper: #f59e0b; --lower: #2dd4bf; --full: #84cc16;
    --equip: #5d6670;
    --accent-strong: #ff7a1a; --accent-text: #ff7a1a; --ok-text: #3ccf7a; --bad-text: #ff6b6b; --on-color: #111418; --ok-strong: #3ccf7a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  main { max-width: 640px; margin: 0 auto; padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  h1 .muted { font-weight: 500; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  ol { padding-left: 20px; margin: 10px 0 0; }
  li { margin-bottom: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .card.warn { background: var(--accent-soft); border-color: transparent; font-size: 14px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .col { display: flex; flex-direction: column; }
  .between { justify-content: space-between; }
  .wrap { flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-color); font-weight: 600; }
  button.small { padding: 4px 9px; font-size: 14px; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.link { border: 0; background: none; padding: 0; color: var(--accent-text); text-decoration: underline; min-height: 0; display: inline; }
  button.wide { width: 100%; margin-bottom: 10px; padding: 12px; }
  input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
  input::placeholder { color: var(--muted); opacity: .55; }
  /* Webbläsarens pilar i sifferfält tar plats och behövs inte; på mobilen syns de inte ändå */
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; width: 100%; resize: vertical; }
  input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--ok); }
  label.field { display: block; font-size: 14px; color: var(--muted); }
  label.field input, label.field select { margin-top: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }
  .bar.ok > div { background: var(--ok); }
  .bar.over > div { background: var(--bad); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 99px; color: var(--on-color); }
  .tag.push { background: var(--push); } .tag.pull { background: var(--pull); } .tag.legs { background: var(--legs); }
  .tag.upper { background: var(--upper); } .tag.lower { background: var(--lower); } .tag.full { background: var(--full); }
  .pill { font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--ok-soft); color: var(--ok-text); font-weight: 600; }
  .delta { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
  .delta.up { background: var(--ok-soft); color: var(--ok-text); }
  .delta.down { background: var(--bad-soft); color: var(--bad-text); }
  .delta.same { background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
  .stat { font-size: 26px; font-weight: 700; }

  /* Upplägg */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .brand { display: flex; gap: 14px; align-items: center; margin: 4px 0 18px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; }
  .brand b { font-size: 26px; letter-spacing: -.01em; display: block; }
  .proglist { display: grid; gap: 8px; }
  .proglist button { text-align: left; padding: 10px 12px; display: grid; gap: 2px; }
  .proglist button.on { border-color: var(--accent); outline: 2px solid var(--accent); }
  .seg.count { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .seg.count button { padding: 8px 0; }
  .seg.two { grid-template-columns: 1fr 1fr; }
  .seg.two button { text-align: left; padding: 10px 12px; }
  .seg.wd { grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .seg.wd button { padding: 9px 0; font-size: 14px; }
  .seg button.on { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-color); }
  .seg button.on .muted { color: var(--on-color); }
  .plan-row { padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .daily-pick { padding: 6px 0; cursor: pointer; }

  /* Pass */
  .daypick { display: grid; gap: 6px; margin-bottom: 14px; }
  .daypick button { padding: 8px 2px; }
  .daypick button.on { outline: 2px solid var(--accent); }
  .daypick .tag { font-size: 10px; padding: 2px 5px; letter-spacing: 0; }
  .card.ex.complete { border-color: var(--ok); }
  .sets { display: grid; grid-template-columns: 24px 1fr 1fr 40px; gap: 6px; align-items: center; margin-top: 10px; }
  .sets.bw { grid-template-columns: 24px 1fr 84px 40px; }
  .sets .n { color: var(--muted); font-size: 14px; text-align: center; }
  .done-btn { width: 40px; height: 38px; padding: 0; font-weight: 700; color: var(--muted); }
  .done-btn.big { width: 44px; height: 44px; border-radius: 99px; flex: none; }
  .done-btn.on { background: var(--ok-strong); border-color: var(--ok-strong); color: var(--on-color); }
  .subex { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .daily { padding: 10px 0; border-top: 1px solid var(--line); }
  .daily:first-of-type { border-top: 0; padding-top: 0; }
  .daily .subex { margin-left: 8px; }
  .runin { width: 140px; gap: 6px; }

  /* Figurer */
  .thumb { padding: 0; border-radius: 10px; background: var(--bg); width: 84px; height: 84px; flex: none; overflow: hidden; }
  .thumb.sm { width: 52px; height: 52px; border-radius: 8px; }
  .thumb.xs { width: 40px; height: 40px; border-radius: 7px; }
  .thumb.done { outline: 2px solid var(--ok); outline-offset: -2px; }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .fig { width: 100%; height: 100%; display: block; }
  .fig.big { width: 100%; height: auto; max-height: 300px; background: var(--bg); border-radius: 12px; margin: 6px 0 8px; }
  .fb { fill: none; stroke: var(--text); stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
  .ff { opacity: .38; }
  .fh { fill: var(--text); }
  .fe { fill: none; stroke: var(--equip); stroke-width: 3; stroke-linecap: round; }
  .fbar { stroke-width: 3.5; }
  .fplate { stroke-width: 4; }
  .fw { fill: var(--accent); }
  .fwbar { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
  .fwplate { stroke-width: 4; }
  .fp { fill: var(--equip); }
  .fc { stroke: var(--equip); stroke-width: 1.2; }
  .ffloor { stroke: var(--line); stroke-width: 2; }

  /* Dialog */
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .pick { border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .pick .thumb { width: 100%; height: auto; aspect-ratio: 1.03; }
  .pick.have { opacity: .55; }
  .pname { font-weight: 600; font-size: 15px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font-size: 14px; padding: 5px 10px; border-radius: 99px; }
  .chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .food { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .food:first-of-type { border-top: 0; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, minmax(0, 150px)); justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); z-index: 5; }
  nav button { border: 0; border-radius: 0; background: transparent; padding: 10px 2px 12px; font-size: 13px; color: var(--muted); }
  nav button.on { color: var(--accent-text); font-weight: 700; }
  nav button span { display: block; font-size: 20px; line-height: 1.1; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; border-top: 0; }
  .hidden { display: none; }
  .goal { margin: 2px 0; }
  .letter h3 { font-size: 18px; margin: 4px 0 10px; text-wrap: balance; }
  .letter-row { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
  .letter-row b { text-align: right; font-variant-numeric: tabular-nums; }
  .letter-foot { margin-top: 10px; font-weight: 600; }
  .letter-card { border-color: var(--accent); }
  .nudge { border-color: var(--accent); }
  .corner-login { position: absolute; top: 18px; right: 0; }
  .stat-sm { font-size: 22px; }
  /* Kugghjul, ändra en tidigare dag */
  #app { position: relative; }
  .gear { position: absolute; top: 14px; right: 0; border: 0; background: none; font-size: 22px; padding: 6px; opacity: .75; }
  .gear.on { opacity: 1; }
  #app > h1 { padding-right: 40px; }
  .editbar { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; margin: 0 44px 12px 0; }
  .editbar b { flex: 1; }
  /* Historik */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; text-align: center; }
  .cal > b { font-size: 12px; color: var(--muted); font-weight: 600; padding-bottom: 2px; }
  .cday { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; padding: 6px 0 4px; min-height: 48px;
    border: 1px solid transparent; background: none; border-radius: 10px; font-variant-numeric: tabular-nums; }
  .cday.has { background: var(--bg); }
  .cday.today { border-color: var(--accent); font-weight: 700; }
  .cday:disabled { opacity: .35; }
  .cmarks { display: flex; gap: 2px; align-items: center; min-height: 10px; }
  .cdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .ccheck { font-style: normal; font-size: 10px; color: var(--ok-text); font-weight: 700; }
  .legend .cdot { margin-right: 2px; }
  .exrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .exrow .linkbtn { padding: 0; text-align: left; font-weight: 600; }
  .exdelta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
  .hrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .hrow:first-of-type { border-top: 0; }
  .sheet .card { border: 0; padding: 0; margin: 0; }
  /* Dailys på Idag */
  .daily { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .daily .grow b { display: block; }
  .daily.ok b { color: var(--muted); }
  .runf { display: flex; flex-direction: column; align-items: center; flex: none; }
  .runf span { font-size: 11px; color: var(--muted); }
  .daily .run { width: 60px; flex: none; text-align: center; padding: 7px 4px; }
  /* Vänner */
  .feed-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .feed-row:first-of-type { border-top: 0; }
  .kudos { border-radius: 99px; padding: 6px 12px; font-size: 15px; flex: none; }
  .kudos.on { background: var(--accent-soft); border-color: var(--accent); }
  .kudos-count { color: var(--muted); font-size: 15px; flex: none; }
  .vcode { font-size: 22px; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
  /* Min dag: dagens pass */
  .exnames { list-style: none; margin: 10px 0 0; padding: 0; }
  .exnames li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
  .exnames li:first-child { border-top: 0; }
  .exnames li.done .grow { color: var(--muted); }
  /* Kost */
  .dayring { display: flex; align-items: center; gap: 14px; }
  .ringwrap { position: relative; width: 96px; height: 96px; flex: none; }
  .ring { width: 96px; height: 96px; display: block; }
  .ring-bg, .ring-fg { fill: none; stroke-width: 8; }
  .ring-bg { stroke: var(--line); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; }
  .ring-fg.over { stroke: var(--bad); }
  .ringnum { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .ringnum b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .ringnum .muted { font-size: 11px; }
  .mcard { padding: 12px; }
  .mhead { margin-bottom: 8px; }
  .mhead h2 { margin: 0; display: flex; align-items: center; gap: 8px; }
  .micon { font-size: 18px; }
  .msum { color: var(--accent-text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; background: var(--bg); border: 0;
    border-radius: 12px; padding: 9px 12px; margin-top: 6px; }
  .tile b { display: block; font-weight: 600; }
  .tile.est b { font-weight: 400; font-style: italic; color: var(--muted); }
  .chev { color: var(--muted); font-size: 20px; line-height: 1; }
  .addfood { width: 100%; margin-top: 8px; padding: 9px; background: none; border: 0; color: var(--accent-text); font-weight: 600; text-align: left; }
  .addfood.empty { border: 1px dashed var(--line); text-align: center; }
  .again { display: block; width: 100%; text-align: left; margin-top: 6px; font-size: 14px; }
  .plist { padding: 4px 16px; }
  .card.plist > * + * { border-top: 1px solid var(--line); }
  .prow-head { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-radius: 0;
    padding: 14px 0; text-align: left; color: var(--text); font: inherit; }
  .prow-head .grow { display: flex; flex-direction: column; min-width: 0; }
  .prow-head .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pic { font-size: 20px; width: 28px; text-align: center; }
  .chev { color: var(--muted); font-size: 20px; transition: transform .15s; }
  .prow.open .chev { transform: rotate(90deg); }
  .prow-body { padding: 0 0 16px; }
  .prow { scroll-margin: 12px 0 calc(90px + env(safe-area-inset-bottom, 0px)); }
  .prow-body .card { border: 0; padding: 0; margin: 0; background: none; box-shadow: none; }
  .prow-body .card > h2:first-child { display: none; }
  .gearbox { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .chip { border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .focus > .row:first-child button { white-space: nowrap; }
  @media (max-width: 359px) { .fcount { display: none; } }
  .chip.ok { color: var(--ok-text); border-color: var(--ok-text); }
  .sheet-sub { font-size: 14px; color: var(--muted); font-weight: 600; margin: 18px 0 4px; }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .qadd { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; min-width: 0; }
  .qadd b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .nrow { gap: 8px; }
  /* Klar ligger alltid i bild längst ner i fönstret */
  .sheet-foot { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--card);
    margin: 12px -16px calc(-20px - env(safe-area-inset-bottom, 0px)); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line); }
  .sheet-foot .wide { margin: 0; }
  .sheet-foot .total { margin-bottom: 8px; font-size: 17px; }
  .qcount { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .qminus { width: 34px; height: 34px; padding: 0; }
  .qtyrow { margin-top: 14px; gap: 12px; }
  .qtyrow .step { width: 48px; height: 48px; font-size: 22px; padding: 0; }
  .qtyrow .qcount { font-size: 20px; min-width: 36px; }
  .nowrap { white-space: nowrap; }
  .qkcal input { flex: 1; }
  .drow { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); color: var(--text); }
  .drow:first-child { border-top: 0; }
  .amtstep { display: flex; align-items: center; gap: 4px; flex: none; }
  .amt-n { width: 56px; flex: none; text-align: center; font-size: 17px; font-weight: 600; padding: 7px 2px; }
  .amt-u { width: auto; flex: none; }
  /* Passet i Träna */
  .exlist { padding: 8px; }
  .exlist .tile { margin-top: 0; margin-bottom: 6px; padding: 8px 10px; }
  .exlist .tile:last-child { margin-bottom: 0; }

<script>
  // Offline och installation på hemskärmen när appen ligger på en vanlig webbplats
  if (!window.claude && "serviceWorker" in navigator && (location.protocol === "https:" || window.__swTest)) {
    // Appen startar från cachen. Finns en ny version installeras den i bakgrunden och
    // tas i bruk nästa gång appen kommer tillbaka i förgrunden.
    const hadWorker = !!navigator.serviceWorker.controller;
    let updated = false;
    navigator.serviceWorker.register("sw.js").then(reg => {
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") return;
        if (updated) location.reload();
        else reg.update().catch(() => {});
      });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadWorker) updated = true; });
  }
</script>

name: Tester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webblasartester:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera testverktyg
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Kontrollera utökade övningskataloger
        run: |
          node tests/test_strength_extra.cjs
          node tests/test_stretch_extra.cjs
          node tests/test_catalog_review.cjs
          node tests/test_search_proxy.cjs
      - name: Kör testerna
        env:
          PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: "1"
        run: |
          # Pytest's async loop conflicts with the synchronous Playwright unittest
          # class setup. Run those six browser tests in a separate Python process
          # instead of skipping their coverage.
          python -m pytest tests -v --ignore=tests/test_stretch_mobile.py
          python -m unittest discover -s tests -p 'test_stretch_mobile.py' -v

name: Tester

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webblasartester:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera testverktyg
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Kör testerna
        run: python -m pytest tests -q -rf --tb=line 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Visa fel som anteckningar (tillfälligt)
        if: failure()
        run: grep -E "^(FAILED|ERROR|/home|E  )" pytest.log | head -40 | sed 's/^/::error::/'
